<!DOCTYPE html>
<html lang="zh-HK">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>2026 太興20送3 禮券簽收</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

    background:#f5f2fb;
    padding:20px;
}

.container{
    max-width:480px;
    margin:auto;
}

.card{
    background:white;
    border-radius:18px;
    padding:24px;
    border-top:6px solid #4B2E83;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.logo{
    text-align:center;
    margin-bottom:15px;
}

.logo img{
    width:100px;
    height:auto;
}

.title{
    text-align:center;
    color:#4B2E83;
    font-size:24px;
    font-weight:700;
    margin-bottom:24px;
}

.label{
    font-weight:600;
    color:#333;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:20px;
    font-size:16px;
}

.readonly{
    background:#f5f5f5;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#4B2E83;
    color:white;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
}

button:hover{
    background:#372062;
}

button:disabled{
    background:#999;
}

.result{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    text-align:center;
    font-weight:600;
}

.success{
    background:#e7f8ee;
    color:#18864b;
}

.error{
    background:#fdeaea;
    color:#c62828;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#888;
    font-size:12px;
}

.boxinfo{
    background:#f8f5ff;
    border:1px solid #e0d8ff;
    border-radius:10px;
    padding:12px;
    margin-bottom:20px;
    color:#4B2E83;
}

.pending{
    color:#e67e22;
    font-weight:bold;
}

.received{
    color:#27ae60;
    font-weight:bold;
}
    
</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
    <img src="太興logo.jpg" alt="Tai Hing Logo">
</div>

<div class="title">
    2026 太興20送3 禮券簽收
</div>

<div class="boxinfo">

<div id="storeName">
載入店舖資料中...
</div>

<div id="storeCode">
</div>

<div id="receiptStatus">
</div>

</div>

<div class="label">
    紙箱號碼
</div>

<input
    id="boxNo"
    class="readonly"
    readonly>

<div class="label">
    員工編號
</div>

<input
    id="staffNo"
    placeholder="請輸入員工編號">

<button
    id="submitBtn"
    onclick="submitReceipt()">
    確認簽收
</button>

<div
    id="result"
    class="result">
</div>

</div>

<div class="footer">
    Tai Hing Group © 2026
</div>

</div>

<script>

const params =
new URLSearchParams(window.location.search);

const boxNo =
params.get("box") || "";loadBoxInfo();

document.getElementById("boxNo").value =
boxNo;

async function loadBoxInfo(){

    try{

        const response =
        await fetch(
        "https://defaultb5c6ebdd19144d1c81ba09b2a50a01.c7.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/18/workflows/d361f00ad685485e852d96fd85dcb89b/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=3QUiD3yAY0sB3zJplLLWdwayVTlfJOrU00oVfwF2upc",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                boxNo:boxNo
            })
        });

        const data =
        await response.json();

        document.getElementById("storeName")
            .innerHTML =
            "店舖：" + data.storeName;

        document.getElementById("storeCode")
            .innerHTML =
            "店號：" + data.storeCode;

       if(data.status=="Received"){

    document.getElementById(
    "receiptStatus"
    ).innerHTML =
    "<span class='received'>✅ 已簽收</span>";

}
else{

    document.getElementById(
    "receiptStatus"
    ).innerHTML =
    "<span class='pending'>⏳ 待簽收</span>";

}

    }
    catch(error){

        document.getElementById("storeName")
            .innerHTML =
            "無法載入店舖資料";

    }

}
    
async function submitReceipt(){

    const staffNo =
    document.getElementById("staffNo")
    .value
    .trim();

    const resultBox =
    document.getElementById("result");

    if(boxNo === ""){
        resultBox.style.display="block";
        resultBox.className="result error";
        resultBox.innerHTML="❌ 找不到紙箱號碼";
        return;
    }

    if(staffNo === ""){
        resultBox.style.display="block";
        resultBox.className="result error";
        resultBox.innerHTML="❌ 請輸入員工編號";
        return;
    }

    const btn =
    document.getElementById("submitBtn");

    btn.disabled = true;
    btn.innerText = "提交中...";

    try{

        /*
        Power Automate URL
        將下面網址改成你的 HTTP Trigger URL
        */

        const response =
        await fetch(
            "https://defaultb5c6ebdd19144d1c81ba09b2a50a01.c7.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/11/workflows/1402b5d62e8f4267891daa585ec4282d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=yxfBriU6DYlXxp5vKJZYN_zSWE13LhI3exrOhzJOegM",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    boxNo:boxNo,
                    staffNo:staffNo
                })
            }
        );

        const data =
        await response.json();

        resultBox.style.display="block";

        if(data.success){

    resultBox.style.display="block";

    resultBox.className=
    "result success";

    resultBox.innerHTML=
    "✅ 簽收成功";

}
else{

    resultBox.style.display="block";

    resultBox.className=
    "result error";

    resultBox.innerHTML=
    data.message;

}

    }
    catch(error){

        resultBox.style.display="block";

        resultBox.className=
        "result error";

        resultBox.innerHTML=
        "❌ 系統連線失敗";

        btn.disabled=false;
        btn.innerText="確認簽收";

        console.error(error);

    }

}

</script>

</body>

</html>
