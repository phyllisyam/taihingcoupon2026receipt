<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>禮券簽收系統</title>

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
    padding:30px;
}

.card{
    max-width:500px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
}

button{
    width:100%;
    padding:12px;
    background:#0078d4;
    color:white;
    border:none;
}

</style>

</head>

<body>

<div class="card">

<h2>禮券簽收系統</h2>

<label>紙箱號碼</label>

<input id="boxNo" readonly>

<label>員工編號</label>

<input id="staffNo">

<button onclick="testSubmit()">
確認簽收
</button>

<p id="msg"></p>

</div>

<script>

const params =
new URLSearchParams(window.location.search);

document.getElementById("boxNo").value =
params.get("box") || "";

function testSubmit(){

    let staff =
    document.getElementById("staffNo").value;

    document.getElementById("msg").innerHTML =
    "成功提交<br>Staff No: "
    + staff;

}

</script>

</body>
</html>
