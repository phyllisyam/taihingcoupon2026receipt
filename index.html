<!DOCTYPE html>
<html lang="zh-HK">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>2026 太興20送3 禮券簽收</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

    background:#f5f2fb;
    padding:20px;
}

.container{
    max-width:480px;
    margin:auto;
}

.card{
    background:white;
    border-radius:18px;
    padding:24px;
    border-top:6px solid #4B2E83;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.logo{
    text-align:center;
    margin-bottom:15px;
}

.logo img{
    width:100px;
    height:auto;
}

.title{
    text-align:center;
    color:#4B2E83;
    font-size:24px;
    font-weight:700;
    margin-bottom:24px;
}

.label{
    font-weight:600;
    color:#333;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:20px;
    font-size:16px;
}

.readonly{
    background:#f5f5f5;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#4B2E83;
    color:white;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
}

button:hover{
    background:#372062;
}

button:disabled{
    background:#999;
}

.result{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    text-align:center;
    font-weight:600;
}

.success{
    background:#e7f8ee;
    color:#18864b;
}

.error{
    background:#fdeaea;
    color:#c62828;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#888;
    font-size:12px;
}

.boxinfo{
    background:#f8f5ff;
    border:1px solid #e0d8ff;
    border-radius:10px;
    padding:12px;
    margin-bottom:20px;
    color:#4B2E83;
}

.pending{
    color:#e67e22;
    font-weight:bold;
}

.received{
    color:#27ae60;
    font-weight:bold;
}
    
</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
    <img src="太興logo.jpg" alt="Tai Hing Logo">
</div>

<div class="title">
    2026 太興20送3 禮券簽收
</div>

<div class="boxinfo">

<div id="storeName">
載入店舖資料中...
</div>

<div id="storeCode">
</div>

<div id="receiptStatus">
</div>

</div>

<div class="label">
    紙箱號碼
</div>

<input
    id="boxNo"
    class="readonly"
    readonly>

<div class="label">
    員工編號
</div>

<input
    id="staffNo"
    placeholder="請輸入員工編號">

<button
    id="submitBtn"
    onclick="submitReceipt()">
    確認簽收
</button>

<div
    id="result"
    class="result">
</div>

</div>

<div class="footer">
    Tai Hing Group © 2026
</div>

</div>

<script>

const LOOKUP_API_URL =
"https://defaultb5c6ebdd19144d1c81ba09b2a50a01.c7.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/05/workflows/3a39ca7453c348578d5188cbe997d26d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=j75tYSbvljGs5Hr5ZAZwzqqcBUvy-97sL8srxTOGZLI";

const RECEIPT_API_URL =
"https://defaultb5c6ebdd19144d1c81ba09b2a50a01.c7.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/11/workflows/1402b5d62e8f4267891daa585ec4282d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=yxfBriU6DYlXxp5vKJZYN_zSWE13LhI3exrOhzJOegM";

const params =
new URLSearchParams(
window.location.search
);

const boxNo =
params.get("box") || "";

document.getElementById("boxNo").value =
boxNo;

loadBoxInfo();

async function loadBoxInfo(){

    try{

        const response =
        await fetch(
        LOOKUP_API_URL,
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                boxNo:boxNo
            })
        });

        const data =
        await response.json();

        console.log(data);

        document.getElementById("storeName")
        .innerHTML =
        "店舖：" + (data.storeName || "");

        document.getElementById("storeCode")
        .innerHTML =
        "店號：" + (data.storeCode || "");

        if(
            data.status &&
            data.status.trim() === "Received"
        ){

            document.getElementById(
            "receiptStatus"
            ).innerHTML =
            "<span class='received'>✅ 已簽收</span>";

            if(data.staffNo){

                document.getElementById(
                "receiptStatus"
                ).innerHTML +=
                "<br>簽收員工：" +
                data.staffNo;

            }

            if(data.receiptTime){

    const dt =
    new Date(data.receiptTime);

    const displayTime =
    dt.getFullYear() + "-" +
    String(dt.getMonth()+1).padStart(2,"0") + "-" +
    String(dt.getDate()).padStart(2,"0") + " " +
    String(dt.getHours()).padStart(2,"0") + ":" +
    String(dt.getMinutes()).padStart(2,"0");

    document.getElementById(
    "receiptStatus"
    ).innerHTML +=
    "<br>簽收時間：" +
    displayTime;

}

            document.getElementById(
            "staffNo"
            ).disabled = true;

            document.getElementById(
            "submitBtn"
            ).disabled = true;

            document.getElementById(
            "submitBtn"
            ).innerText =
            "已完成簽收";

        }
        else{

            document.getElementById(
            "receiptStatus"
            ).innerHTML =
            "<span class='pending'>⏳ 待簽收</span>";

            document.getElementById(
            "staffNo"
            ).disabled = false;

            document.getElementById(
            "submitBtn"
            ).disabled = false;

            document.getElementById(
            "submitBtn"
            ).innerText =
            "確認簽收";

        }

    }
    catch(error){

        console.error(error);

        document.getElementById(
        "storeName"
        ).innerHTML =
        "無法載入店舖資料";

    }

}

async function submitReceipt(){

    const staffNo =
    document.getElementById("staffNo")
    .value
    .trim();

    const resultBox =
    document.getElementById("result");

    if(boxNo===""){

        resultBox.style.display="block";
        resultBox.className="result error";
        resultBox.innerHTML=
        "❌ 找不到紙箱號碼";
        return;

    }

    if(staffNo===""){

        resultBox.style.display="block";
        resultBox.className="result error";
        resultBox.innerHTML=
        "❌ 請輸入員工編號";
        return;

    }

    const btn =
    document.getElementById(
    "submitBtn"
    );

    btn.disabled = true;
    btn.innerText = "提交中...";

    try{

        const response =
        await fetch(
        RECEIPT_API_URL,
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                boxNo:boxNo,
                staffNo:staffNo
            })
        });

        const data =
        await response.json();

        resultBox.style.display="block";

        if(data.success){

            resultBox.className=
            "result success";

            resultBox.innerHTML=
            "✅ 簽收成功";

            setTimeout(
                loadBoxInfo,
                1000
            );

        }
        else{

            resultBox.className=
            "result error";

            resultBox.innerHTML=
            "⚠️ " +
            data.message;

            btn.disabled=false;
            btn.innerText=
            "確認簽收";

        }

    }
    catch(error){

        console.error(error);

        resultBox.style.display=
        "block";

        resultBox.className=
        "result error";

        resultBox.innerHTML=
        "❌ 系統連線失敗";

        btn.disabled=false;
        btn.innerText=
        "確認簽收";

    }

}

</script>

</body>

</html>

</html>
