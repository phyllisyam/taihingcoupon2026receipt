<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>2026 20送3 禮券簽收系統</title>

<style>

body{
    background:#f3f5f4;
    font-family:Arial;
    padding:20px;
}

.card{
    max-width:500px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 3px 15px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    color:#1D5D4F;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0 20px;
    border:1px solid #ddd;
    border-radius:10px;
}

button{
    width:100%;
    padding:14px;
    background:#1D5D4F;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
}

</style>

</head>

<body>

<div class="card">

<div style="text-align:center">
    <img src="太興logo.jpg" width="100">
</div>    
    
<h2>禮券簽收系統</h2>

<label>紙箱號碼</label>
<input id="boxNo" readonly>

<label>員工編號</label>
<input id="staffNo">


<button onclick="testSubmit()">
確認簽收
</button>

<p id="msg"></p>

</div>

<script>

const params =
new URLSearchParams(window.location.search);

document.getElementById("boxNo").value =
params.get("box") || "";

function testSubmit(){

    let staff =
    document.getElementById("staffNo").value;

    document.getElementById("msg").innerHTML =
    "成功提交<br>Staff No: "
    + staff;

}

</script>

</body>
</html>
